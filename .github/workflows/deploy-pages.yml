name: Deploy NeuroVista to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare real anatomical brain
        run: |
          mkdir -p models
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/itayinbarr/brainproject/main/brain-atlas/models/brain.glb \
            -o models/brain.glb
          python scripts/upgrade_real_brain.py
          test -s models/brain.glb
          grep -q 'REAL_ANATOMICAL_BRAIN_V2' index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
