name: Deploy NeuroVista to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare anatomical brain with visible lobe colors
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Ensure GLTFLoader is imported in a browser-compatible way.
          if "GLTFLoader" not in s:
              s = s.replace(
                  "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js';",
                  "import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.171.0/build/three.module.js';\nimport { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/loaders/GLTFLoader.js?module';"
              )
          else:
              s = s.replace(
                  "import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/loaders/GLTFLoader.js';",
                  "import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.171.0/examples/jsm/loaders/GLTFLoader.js?module';"
              )

          marker = "this.group=new THREE.Group();this.group.rotation.set(.08,-.12,0);this.scene.add(this.group);"
          start = s.find(marker)
          if start != -1:
              after = start + len(marker)
              # Remove any older real-brain injection up to the original procedural shell.
              shell_idx = s.find("const shell=new THREE.MeshPhysicalMaterial", after)
              if shell_idx != -1:
                  prefix = s[:after]
                  suffix = s[shell_idx:]
                  inject = r'''
this.realBrainModel=true;
this.regionMeshes={};
const loader=new GLTFLoader();
loader.load('assets/brain.glb',g=>{
  const root=g.scene;
  root.name='AnatomicalBrain';
  this.group.add(root);
  root.updateMatrixWorld(true);
  const box0=new THREE.Box3().setFromObject(root);
  const size0=box0.getSize(new THREE.Vector3());
  const center0=box0.getCenter(new THREE.Vector3());
  root.position.sub(center0);
  const scale=2.85/Math.max(size0.x,size0.y,size0.z);
  root.scale.setScalar(scale);
  root.rotation.set(.06,-.34,0);
  root.updateMatrixWorld(true);

  const all=[];
  root.traverse(o=>{if(o.isMesh){
    o.geometry.computeBoundingBox?.();
    const c=o.geometry.boundingBox?o.geometry.boundingBox.getCenter(new THREE.Vector3()):new THREE.Vector3();
    o.localToWorld(c);
    all.push({o,c,name:(o.name+' '+(o.parent?.name||'')).toLowerCase()});
  }});
  const bbox=new THREE.Box3().setFromObject(root);
  const bsize=bbox.getSize(new THREE.Vector3());
  const bmin=bbox.min;
  const norm=v=>new THREE.Vector3((v.x-bmin.x)/(bsize.x||1),(v.y-bmin.y)/(bsize.y||1),(v.z-bmin.z)/(bsize.z||1));
  const colors={
    'Frontal Lobe':0x34b6ff,
    'Parietal Lobe':0x55efb3,
    'Temporal Lobe':0xffb12b,
    'Occipital Lobe':0xa96cff,
    'Cerebellum':0xff85b8,
    'Brain Stem':0x43e6ff
  };
  const byName=(n)=>{
    if(/frontal|precentral|orbitofrontal|frontopolar/.test(n)) return 'Frontal Lobe';
    if(/parietal|postcentral|precuneus|supramarginal|angular gyrus/.test(n)) return 'Parietal Lobe';
    if(/temporal|hippocamp|amygdal|fusiform/.test(n)) return 'Temporal Lobe';
    if(/occipital|calcarine|cuneus|lingual/.test(n)) return 'Occipital Lobe';
    if(/cerebell|vermis/.test(n)) return 'Cerebellum';
    if(/brain.?stem|medulla|pons|midbrain|mesenceph|peduncle/.test(n)) return 'Brain Stem';
    return null;
  };
  const byPosition=(v)=>{
    const n=norm(v);
    if(n.y<.28 && n.z<.58) return 'Cerebellum';
    if(n.y<.30 && n.z>=.58) return 'Brain Stem';
    if(n.z>.66) return 'Frontal Lobe';
    if(n.z<.28) return 'Occipital Lobe';
    if(n.y<.48) return 'Temporal Lobe';
    return 'Parietal Lobe';
  };
  this.meshes={};
  all.forEach(({o,c,name})=>{
    const region=byName(name)||byPosition(c);
    const color=colors[region];
    const col=new THREE.Color(color);
    o.material=new THREE.MeshPhysicalMaterial({
      color:col,
      emissive:col,
      emissiveIntensity:.12,
      roughness:.36,
      metalness:.015,
      clearcoat:.52,
      clearcoatRoughness:.24,
      transparent:true,
      opacity:.90,
      side:THREE.DoubleSide
    });
    o.userData.region=region;
    (this.regionMeshes[region]??=[]).push(o);
    if(!this.meshes[region]) this.meshes[region]=o;
  });

  // Add a faint cyan anatomical shell so gyri/sulci stay readable without washing out region colors.
  root.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;}});
},undefined,e=>{console.error('Brain model failed to load',e)});
'''
                  # Keep procedural fallback disabled while real model is used.
                  suffix = suffix.replace("const shell=new THREE.MeshPhysicalMaterial", "if(!this.realBrainModel){const shell=new THREE.MeshPhysicalMaterial", 1)
                  suffix = suffix.replace("this.group.add(this.points);", "this.group.add(this.points);}", 1)
                  s = prefix + inject + suffix

          # Make selection/highlight work on every mesh belonging to a region.
          s = s.replace(
              "const h=this.ray.intersectObjects(Object.values(this.meshes),false)[0];this.hover=h?.object.userData.region||null;",
              "const hitTargets=this.regionMeshes?Object.values(this.regionMeshes).flat():Object.values(this.meshes);const h=this.ray.intersectObjects(hitTargets,false)[0];this.hover=h?.object.userData.region||null;"
          )
          s = s.replace(
              "for(const [k,m] of Object.entries(this.meshes)){const active=this.selected===k||this.hover===k;const dim=(this.selected||this.hover)&&!active;m.material.opacity=this.layers?(active ? .83 : dim ? .25 : .54):0;m.material.emissiveIntensity=active ? .78 : .18;const s=active?1.035:1;m.scale.lerp(new THREE.Vector3(s,s,s),.08)}",
              "for(const [k,list] of Object.entries(this.regionMeshes||{})){const active=this.selected===k||this.hover===k;const dim=(this.selected||this.hover)&&!active;for(const m of list){m.material.opacity=this.layers?(active?.98:dim?.22:.90):0;m.material.emissiveIntensity=active?.42:.12}}"
          )
          s = s.replace('active?.98:dim?.22:.90','active ? .98 : dim ? .22 : .90')
          s = s.replace('active?.42:.12','active ? .42 : .12')
          s = s.replace('active?.83:dim?.25:.54','active ? .83 : dim ? .25 : .54')
          s = s.replace('active?.78:.18','active ? .78 : .18')
          p.write_text(s)
          PY

          mkdir -p assets
          curl -L --fail --retry 3 -o assets/brain.glb https://raw.githubusercontent.com/itayinbarr/brainproject/main/brain-atlas/models/brain.glb

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
